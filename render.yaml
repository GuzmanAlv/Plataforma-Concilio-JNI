services:
  - type: web
    name: concilio-jni-dreamrs
    runtime: static
    buildCommand: bash scripts/render-build.sh
    staticPublishPath: build/web
    autoDeployTrigger: checksPass
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Flutter 3.44 uses unhashed JS names. Revalidate all resources on updates.
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
