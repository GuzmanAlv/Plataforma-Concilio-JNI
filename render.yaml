services:
  - type: web
    name: concilio-jni-dreamrs
    branch: main
    runtime: static
    buildCommand: bash scripts/render-build.sh
    staticPublishPath: build/web
    autoDeployTrigger: checksPass
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: APK_DOWNLOAD_URL
        sync: false
      - key: APK_SHA256
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /downloads/*.apk
        name: Content-Type
        value: application/vnd.android.package-archive
      - path: /downloads/*.apk
        name: Content-Disposition
        value: attachment; filename="concilio-jni-dreamrs.apk"
      # Flutter 3.44 uses unhashed JS names. Revalidate all resources on updates.
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
